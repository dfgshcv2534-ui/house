name: 매일 공고 업데이트

on:
  schedule:
    - cron: "0 21 * * *"   # 매일 06:00 KST (GitHub 사정으로 몇 분~수십 분 늦을 수 있음)
  workflow_dispatch:        # Actions 탭에서 'Run workflow'로 바로 실행

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 설치
        run: pip install -r requirements.txt pytest

      - name: 테스트
        run: python -m pytest -q

      - name: 공고 수집
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python -m collector

      - name: 변경 사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data docs/plans
          if git diff --cached --quiet; then
            echo "바뀐 공고 없음"
          else
            git commit -m "공고 업데이트 $(TZ=Asia/Seoul date +%Y-%m-%d)"
            git push
          fi
