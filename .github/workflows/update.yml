name: 매일 공고 업데이트

on:
  schedule:
    # GitHub 예약 실행은 정각(:00)에 몰려 몇 시간씩 밀리기 쉬워서 정각을 피해 둔다
    - cron: "47 20 * * *"  # 매일 05:47 KST
    - cron: "47 8 * * *"   # 매일 17:47 KST — 낮에 올라온 공고를 그날 저녁에 반영
  workflow_dispatch:        # Actions 탭에서 'Run workflow'로 바로 실행

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 설치
        run: |
          pip install -r requirements.txt pytest
          python -m playwright install --with-deps chromium

      - name: 테스트
        run: python -m pytest -q

      - name: 공고 수집
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python -m collector

      - name: 변경 사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data docs/plans
          if git diff --cached --quiet; then
            echo "바뀐 공고 없음"
          else
            git commit -m "공고 업데이트 $(TZ=Asia/Seoul date +%Y-%m-%d)"
            # 수집하는 동안 코드가 바뀌었으면 받아서 합친 뒤 올린다 (데이터 파일만 바뀌어서 충돌 없음)
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              sleep 5
            done
          fi
