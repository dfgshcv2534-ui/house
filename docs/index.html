<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>서울 공공주택 모아보기</title>
<meta name="description" content="서울 공공분양·민영 청약·SH 행복주택·장기전세 공고를 매일 아침 모아 D-day로 보여줘요.">
<meta property="og:title" content="서울 공공주택 모아보기">
<meta property="og:description" content="서울 분양·임대 공고를 매일 아침 6시에 모아 D-day로 정리해요.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111317" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1>서울 공공주택 모아보기</h1>
      <p class="updated" id="updated">불러오는 중…</p>
    </div>
    <div id="sourceAlert" class="alert" hidden></div>
    <nav class="tabs" role="tablist" aria-label="분류">
      <button role="tab" data-tab="분양">분양 <span class="count" data-count="분양"></span></button>
      <button role="tab" data-tab="임대">임대 <span class="count" data-count="임대"></span></button>
      <button role="tab" data-tab="특수형">특수형 <span class="count" data-count="특수형"></span></button>
      <button role="tab" data-tab="전체">전체 <span class="count" data-count="전체"></span></button>
    </nav>
  </div>
</header>

<main class="wrap">
  <p class="tab-note" id="tabNote" hidden>토지임대부·분양전환 임대·지분적립형·나눔형처럼 <b>일반 분양·임대와 소유 구조나 전환 조건이 다른 주택</b>이에요. 카드를 눌러 유형별 특징을 확인하세요.</p>
  <section class="stats" id="stats" aria-label="요약"></section>

  <section class="filters" aria-label="필터">
    <div class="search">
      <input id="q" type="search" placeholder="단지명·지역 검색 (예: 고덕, 마곡)" autocomplete="off">
    </div>
    <div class="selects">
      <label><span class="sr">유형</span><select id="kind"><option value="">모든 유형</option></select></label>
      <label><span class="sr">자치구</span><select id="gu"><option value="">서울 전체</option></select></label>
      <label><span class="sr">정렬</span><select id="sort">
        <option value="deadline">마감 임박순</option>
        <option value="recent">최신 공고순</option>
        <option value="price">분양가 낮은순</option>
      </select></label>
    </div>
    <div class="chips" id="statusChips" role="group" aria-label="상태">
      <button data-status="open">접수중</button>
      <button data-status="upcoming">접수 예정</button>
      <button data-status="check">일정 확인 필요</button>
      <button data-status="closed">마감</button>
      <button data-fav="1">☆ 관심</button>
    </div>
    <div class="chips" id="targetChips" role="group" aria-label="대상"></div>
  </section>

  <div class="viewbar">
    <p class="result" id="result"></p>
    <div class="seg" role="tablist" aria-label="보기">
      <button data-view="list">목록</button>
      <button data-view="agenda">일정표</button>
    </div>
  </div>

  <section id="list" class="list" aria-live="polite"></section>
  <section id="agenda" class="agenda" hidden></section>
</main>

<footer class="wrap foot">
  <p>매일 오전 6시(KST)에 <a href="https://www.applyhome.co.kr" target="_blank" rel="noopener">청약홈</a>·<a href="https://www.i-sh.co.kr" target="_blank" rel="noopener">SH</a>·<a href="https://apply.lh.or.kr" target="_blank" rel="noopener">LH</a> 공고를 자동으로 모읍니다.</p>
  <p>참고용 정보예요. 자격·일정·가격은 반드시 <strong>공고문 원문</strong>으로 확인하세요. SH 일정은 공고 본문에서 자동으로 읽은 값이라 틀릴 수 있어요.</p>
</footer>

<dialog id="detail" class="sheet" aria-labelledby="dTitle">
  <div class="sheet-inner" id="detailBody"></div>
</dialog>

<div id="toast" class="toast" role="status" hidden></div>

<script src="app.js"></script>
</body>
</html>
